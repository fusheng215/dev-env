# /etc/wsl.conf — dev-env
# Deploy into a WSL distro with:  dev-env\wsl\setup-wsl.ps1  (or copy manually to /etc/wsl.conf)
[automount]
enabled = true
options = "metadata,uid=1000,gid=1000,umask=022,fmask=011"
mountFsTab = false

[interop]
enabled = true
appendWindowsPath = true

[network]
generateHosts = true
generateResolvConf = true

[boot]
systemd = false

[user]
default = ruomeng
