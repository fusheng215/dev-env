# starship.toml — cross-shell prompt (used by Git Bash via `starship init bash`)
# Install: scoop install starship   |   brew install starship
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

prompt_order = ["username", "directory", "git_branch", "git_status", "nodejs", "python", "rust", "golang", "java", "dotnet", "python", "cmd_duration", "line_break", "character"]

[username]
style_user = "bold cyan"
format = "[$user]($style) "
show_always = true

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold green"
detect_extensions = ["js", "ts", "mjs", "cjs", "mts", "cts"]

[python]
symbol = " "
format = '[$symbol($version )(\($virtualenv\) )]($style)'
style = "bold yellow"

[rust]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[dotnet]
symbol = " "
style = "blue"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
format = "[⏱ $duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
